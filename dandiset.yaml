description: In this project, we studied how the responses to levodopa change over
  time in a mouse model of Parkinson’s Disease. We compared the behavioral response
  to levodopa over 4 weeks of treatment, including the severity and duration of levodopa-induced
  dyskinesia. In parallel, we recorded the activity of striatal projection neurons
  using single-unit electrophysiology. We implanted 6-OHDA-treated mice with multi-electrode
  arrays in the dorsolateral striatum (DLS). We monitored movement of the mouse in
  the open field with video tracking, performed manual dyskinesia scoring with the
  Abnormal Involuntary Movement Score (AIMS), and recorded extracellular voltage from
  each of the multi-electrode array channels. Each session contained a baseline period,
  where the mouse was in the parkinsonian (OFF) state, followed by intraperitoneal
  injection of levodopa (5 mg/kg, with benserazide), which induced both therapeutic
  and dyskinetic responses, and eventually wore off, towards the end of each 2-3 hour
  recording. After the recordings, we performed automated spike sorting (Kilosort)
  with manual curation to ensure the quality of single units, and aligned spiking
  of each single unit with behavioral data.
